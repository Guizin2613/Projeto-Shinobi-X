
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Ninja | Projeto Shinobi X</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-symbol">忍</div>

        <p class="auth-brand">
            PROJETO <span>SHINOBI X</span>
        </p>

        <div class="auth-heading">

            <p class="auth-kicker">A VILA ESTAVA ESPERANDO</p>

            <h1>Que bom ter você de volta!</h1>

            <p class="auth-subtitle">
                Retome sua jornada ninja e continue construindo seu legado.
            </p>

        </div>

        <div class="auth-divider"></div>

        {% if erro %}

        <div class="erro-modal" role="alert">

            <button
                type="button"
                class="fechar-erro"
                aria-label="Fechar mensagem de erro"
                onclick="this.parentElement.style.display='none'"
            >
                ×
            </button>

            <h2>USUÁRIO OU SENHA INCORRETOS</h2>

            <p>Confira seus dados e tente novamente.</p>

        </div>

        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="auth-field">

                <label for="usuario">Nome ninja</label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Digite seu nome ninja"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="auth-field">

                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button class="auth-button" type="submit">
                CONTINUAR JORNADA
                <span aria-hidden="true">→</span>
            </button>

        </form>

        <p class="auth-switch">
            Ainda não tem uma conta?
            <a href="{{ url_for('cadastro') }}">Comece agora</a>
        </p>

        <p class="auth-footer">
            SEU CAMINHO NINJA CONTINUA.
        </p>

    </main>
    <script src="{{ url_for('static', filename='transicoes.js') }}"></script>
</body>

</html>
