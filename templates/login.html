<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Shinobi X</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="cadastro-page">

    <div class="cadastro-container">

        <h1>PROJETO SHINOBI X</h1>

        <p class="subtitulo">
            Entre na sua conta ninja
        </p>

        <form method="POST">

            <label>
                Usuário
            </label>

            <input
                type="text"
                name="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label>
                Senha
            </label>

            <input
                type="password"
                name="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                ENTRAR
            </button>

        </form>

        <div class="login">

            Ainda não possui uma conta?

            <a href="/cadastro">
                Criar conta
            </a>

        </div>

    </div>

</body>

</html>
